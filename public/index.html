<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDlists</title>
<script>
  // 前端版本号：服务端启动时自动替换
  var APP_VERSION = '20261020';
  // 数据源列表：服务端启动时注入（格式：[{id, name}, ...]）
  var DRIVE_SOURCES = [];
</script>
<!-- ── PDF.js ─────────────────────────────────────────────────────────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js?v=20261020"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js?v=20261020';
  }
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --border: #e0e0e0;
    --text: #212121;
    --text-muted: #757575;
    --accent: #1a73e8;
    --accent-hover: #1557b0;
    --danger: #d32f2f;
    --row-hover: #f8f9fa;
    --font: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

  /* ── Login ── */
  #login-page {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 40px 36px; width: 320px;
  }
  .login-card h1 { font-size: 20px; margin-bottom: 24px; text-align: center; }
  .login-card label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .login-card input {
    width: 100%; border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 10px; font-size: 14px; margin-bottom: 16px;
    outline: none; transition: border-color .15s;
  }
  .login-card input:focus { border-color: var(--accent); }
  .btn {
    display: inline-block; padding: 8px 18px; border-radius: 4px; border: none;
    cursor: pointer; font-size: 14px; font-family: var(--font); transition: background .15s;
  }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; width: 100%; text-align: center; text-decoration: none; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-sm { padding: 4px 12px; font-size: 12px; }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  header .btn-primary { background: var(--accent); color: #fff; width: auto; }
  header .btn-primary:hover { background: var(--accent-hover); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--row-hover); }
  .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
  .btn-danger:hover { background: #fee; }
  .error-msg { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 16px; }

  /* ── App ── */
  #app-page { display: none; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .logo { font-weight: 600; font-size: 16px; color: var(--text); }
  header .actions { display: flex; align-items: center; gap: 12px; }
  header .user-info { color: var(--text-muted); font-size: 13px; }

  /* ── Source Tabs ── */
  #source-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: none; /* 单源时隐藏 */
    gap: 0;
    overflow-x: auto;
  }
  #source-bar.show { display: flex; }
  .source-tab {
    padding: 10px 18px;
    border: none;
    border-bottom: 3px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
    font-family: var(--font);
  }
  .source-tab:hover { color: var(--text); }
  .source-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 600;
  }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

  /* breadcrumb */
  .breadcrumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 16px; font-size: 13px; }
  .breadcrumb span { color: var(--text-muted); }

  /* 文本按钮（用于文件名 / 面包屑，可用键盘操作） */
  .link-btn {
    background: none; border: none; padding: 0; margin: 0;
    color: var(--accent); font: inherit; cursor: pointer; text-align: left;
  }
  .link-btn:hover { text-decoration: underline; }
  .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .breadcrumb .link-btn { color: var(--accent); }

  /* toolbar */
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 200px;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 12px; font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .sort-select {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 12px; font-size: 13px; background: var(--surface);
    cursor: pointer; outline: none;
  }
  .sort-select:focus { border-color: var(--accent); }

  /* file table */
  .file-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .file-table th {
    text-align: left; padding: 10px 14px; font-size: 12px; font-weight: 600;
    color: var(--text-muted); border-bottom: 1px solid var(--border); background: #fafafa;
  }
  .file-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .file-table tr:last-child td { border-bottom: none; }
  .file-table tbody tr:hover { background: var(--row-hover); }

  .file-icon { margin-right: 8px; font-size: 15px; }
  .file-name { display: flex; align-items: center; }

  .col-name { width: 50%; }
  .col-size { width: 12%; color: var(--text-muted); }
  .col-modified { width: 18%; color: var(--text-muted); }
  .col-action { width: 20%; text-align: right; white-space: nowrap; }

  /* action buttons */
  .action-btns { display: flex; gap: 4px; justify-content: flex-end; }
  .btn-cache { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-cache:hover { border-color: #f59e0b; color: #f59e0b; background: #fffbeb; }
  .btn-cache.cached { border-color: #16a34a; color: #16a34a; background: #f0fdf4; }
  .btn-cache.caching { border-color: #f59e0b; color: #f59e0b; background: #fffbeb; opacity: .8; pointer-events: none; }
  .btn-share { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  .btn-share:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }

  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  .empty { text-align: center; padding: 40px; color: var(--text-muted); }

  /* modal */
  .modal-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.4); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 8px; padding: 28px 28px 20px;
    width: 480px; max-width: 96vw;
  }
  .modal h3 { margin-bottom: 16px; font-size: 15px; }
  .modal .modal-footer { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }

  /* preview modal */
  #preview-modal { align-items: flex-start; padding-top: 40px; }
  #preview-modal .modal {
    width: 900px; max-width: 96vw; height: 80vh;
    display: flex; flex-direction: column; padding: 20px 24px 16px;
  }
  #preview-modal .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; flex-shrink: 0; gap: 12px;
  }
  #preview-modal .modal-header h3 { margin-bottom: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #preview-area {
    flex: 1; min-height: 0; overflow: auto;
    border: 1px solid var(--border); border-radius: 4px;
    background: #fff;
  }
  #preview-area img { display: block; max-width: 100%; max-height: 100%; margin: 0 auto; object-fit: contain; }
  #preview-area pre {
    padding: 16px; margin: 0; white-space: pre-wrap; word-break: break-all;
    font-size: 13px; line-height: 1.6; overflow: auto; height: 100%;
  }
  #preview-area iframe { width: 100%; height: 100%; border: none; }
  .doc-preview { padding: 20px; font-family: sans-serif; line-height: 1.6; }
  .doc-preview img { max-width: 100%; }
  #pdf-container { width: 100%; height: 100%; overflow: auto; background: #525659; }
  #pdf-pages { min-height: 100%; }
  .pdf-page {
    display: flex; align-items: center; justify-content: center;
    background: #fff; margin: 16px auto; max-width: 100%;
  }
  .pdf-page canvas { display: block; max-width: 100%; }
  .pdf-page-error { color: #757575; font-size: 13px; background: #eee; }
  .pdf-loading { color: #ccc; text-align: center; padding: 20px; }
  .pdf-page-controls {
    position: sticky; bottom: 0; background: #333; color: #fff;
    padding: 8px 16px; display: flex; align-items: center; gap: 12px;
    font-size: 13px;
  }
  .pdf-page-controls button { background: #555; border: 1px solid #777; color: #fff; padding: 2px 10px; border-radius: 4px; cursor: pointer; }
  .pdf-page-controls button:disabled { opacity: .4; cursor: not-allowed; }
  .pdf-meta { margin-left: auto; font-size: 12px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
  .preview-note {
    position: sticky; bottom: 0; background: #fff8e1; color: #8a6d3b;
    padding: 8px 12px; font-size: 12px; border-top: 1px solid #f0e0b0;
  }
  .no-preview {
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center;
    height: 100%; color: var(--text-muted); font-size: 14px; padding: 20px; text-align: center;
  }

  /* ── Responsive / Mobile ── */
  @media (max-width: 640px) {
    header { padding: 0 12px; }
    header .logo { font-size: 14px; }
    header .user-info { display: none; }
    .container { padding: 12px 8px; }
    #source-bar { padding: 0 12px; }
    .source-tab { padding: 8px 12px; font-size: 12px; }
    .file-table { font-size: 13px; }
    .file-table th, .file-table td { padding: 8px 10px; }
    .col-size, .col-modified { display: none; }
    .col-name { width: auto; }
    .col-action { width: auto; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .toolbar { flex-direction: column; }
    .search-input { min-width: unset; width: 100%; }
    .sort-select { width: 100%; }
  }

  /* ── Results count ── */
  .results-info { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; min-height: 18px; }
</style>
</head>
<body>

<!-- ── Login Page ── -->
<div id="login-page">
  <div class="login-card">
    <h1>GDlists</h1>
    <label for="username">用户名</label>
    <input type="text" id="username" autocomplete="username" placeholder="username">
    <label for="password">密码</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    <button type="button" class="btn btn-primary" id="login-btn">登录</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ── App Page ── -->
<div id="app-page">
  <header>
    <div class="logo">📁 GDlists</div>
    <div class="actions header-actions">
      <span class="user-info" id="header-user"></span>
      <button type="button" class="btn btn-outline btn-sm" id="logout-btn">退出</button>
    </div>
  </header>

  <!-- 数据源切换标签（多源时显示） -->
  <div id="source-bar"></div>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb"></div>

    <!-- Search and Sort Bar -->
    <div class="toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 搜索文件…">
      <select id="sort-select" class="sort-select">
        <option value="folder,name">默认排序</option>
        <option value="name">按名称 ↑</option>
        <option value="name desc">按名称 ↓</option>
        <option value="size">按大小 ↑</option>
        <option value="size desc">按大小 ↓</option>
        <option value="modifiedTime">最旧在前</option>
        <option value="modifiedTime desc">最新在前</option>
      </select>
    </div>
    <div class="results-info" id="results-info"></div>

    <table class="file-table" id="file-table">
      <thead>
        <tr>
          <th class="col-name">名称</th>
          <th class="col-size">大小</th>
          <th class="col-modified">修改时间</th>
          <th class="col-action">操作</th>
        </tr>
      </thead>
      <tbody id="file-list">
        <tr><td colspan="4" class="loading">加载中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ── Preview Modal ── -->
<div class="modal-backdrop" id="preview-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="preview-title">文件预览</h3>
      <button type="button" class="btn btn-outline btn-sm" id="preview-close">关闭</button>
    </div>
    <div id="preview-area">
      <div class="no-preview">加载中…</div>
    </div>
  </div>
</div>

<script>
'use strict';

const FOLDER_MIME = 'application/vnd.google-apps.folder';
const TEXT_PREVIEW_MAX = 500 * 1024;
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const XLSX_MIMES = [
  'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  'application/vnd.ms-excel',
  'application/vnd.google-apps.spreadsheet'
];
const MAMMOTH_URL = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js';
const XLSX_URL = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';

const state = {
  folderId: '',
  sourceId: '',
  files: [],
  search: '',
  sort: 'folder,name',
  truncated: false,
  loadSeq: 0
};

// ── Utility ───────────────────────────────────────────────────────────────
function fmtSize(bytes) {
  const b = parseInt(bytes, 10);
  if (!b || b <= 0) return '—';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1024 * 1024 * 1024) return (b / 1024 / 1024).toFixed(1) + ' MB';
  return (b / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('zh-CN', { hour12: false });
}
function fileIcon(mimeType) {
  const m = mimeType || '';
  if (m === FOLDER_MIME) return '📁';
  if (m.startsWith('image/')) return '🖼️';
  if (m.startsWith('video/')) return '🎬';
  if (m.startsWith('audio/')) return '🎵';
  if (m.includes('pdf')) return '📄';
  if (m.includes('zip') || m.includes('tar') || m.includes('rar') || m.includes('7z')) return '🗜️';
  if (m.includes('spreadsheet') || m.includes('excel')) return '📊';
  if (m.includes('document') || m.includes('word')) return '📝';
  return '📎';
}
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function withSource(url) {
  if (!state.sourceId) return url;
  const sep = url.includes('?') ? '&' : '?';
  return `${url}${sep}sourceId=${encodeURIComponent(state.sourceId)}`;
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// ── API ───────────────────────────────────────────────────────────────────
async function apiJson(url, options) {
  let response;
  try {
    response = await fetch(url, Object.assign({ credentials: 'same-origin' }, options));
  } catch {
    throw new Error('网络错误，请检查连接');
  }
  if (response.status === 401) {
    showLogin();
    throw new Error('登录已过期，请重新登录');
  }
  let data = null;
  try { data = await response.json(); } catch { /* 非 JSON 响应 */ }
  if (!response.ok) throw new Error((data && data.error) || `请求失败 (HTTP ${response.status})`);
  return data || {};
}

async function errorMessage(response) {
  try {
    const data = await response.json();
    return data.error || `请求失败 (HTTP ${response.status})`;
  } catch {
    return `请求失败 (HTTP ${response.status})`;
  }
}

const _scriptCache = {};
function loadScript(url, globalVar) {
  if (_scriptCache[url] && window[globalVar]) return Promise.resolve(window[globalVar]);
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = url;
    script.onload = () => { _scriptCache[url] = true; resolve(window[globalVar]); };
    script.onerror = () => reject(new Error('CDN 加载失败，请检查网络: ' + url));
    document.head.appendChild(script);
  });
}

// ── Auth ──────────────────────────────────────────────────────────────────
function showLogin() {
  closePreview();
  document.getElementById('app-page').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('header-user').textContent = '';
  const pwd = document.getElementById('password');
  pwd.value = '';
  document.getElementById('username').focus();
}

async function checkAuth() {
  try {
    const data = await apiJson('/api/auth');
    if (data.authenticated) showApp(data.username);
  } catch { /* 未登录 / 网络异常，停留在登录页 */ }
}

async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errorEl.textContent = '';
  if (!username || !password) { errorEl.textContent = '请输入用户名和密码'; return; }

  btn.disabled = true;
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username, password })
    });
    let data = {};
    try { data = await response.json(); } catch { /* ignore */ }
    if (!response.ok) { errorEl.textContent = data.error || '登录失败'; return; }
    document.getElementById('password').value = '';
    showApp(data.username || username);
  } catch {
    errorEl.textContent = '网络错误，请稍后重试';
  } finally {
    btn.disabled = false;
  }
}

async function doLogout() {
  try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch { /* ignore */ }
  state.files = [];
  state.loadSeq += 1;
  showLogin();
}

function showApp(username) {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app-page').style.display = 'block';
  document.getElementById('header-user').textContent = username || '';

  if (DRIVE_SOURCES && DRIVE_SOURCES.length > 0 && !DRIVE_SOURCES.some(s => s.id === state.sourceId)) {
    state.sourceId = DRIVE_SOURCES[0].id;
  }
  renderSourceBar();
  loadFiles('');
}

// ── Source tabs ───────────────────────────────────────────────────────────
function renderSourceBar() {
  const bar = document.getElementById('source-bar');
  bar.textContent = '';
  if (!DRIVE_SOURCES || DRIVE_SOURCES.length <= 1) {
    bar.classList.remove('show');
    return;
  }
  DRIVE_SOURCES.forEach(source => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'source-tab' + (source.id === state.sourceId ? ' active' : '');
    tab.dataset.sourceId = source.id;
    tab.textContent = source.name;
    tab.addEventListener('click', () => switchSource(source.id));
    bar.appendChild(tab);
  });
  bar.classList.add('show');
}

function switchSource(sourceId) {
  if (sourceId === state.sourceId) return;
  state.sourceId = sourceId;
  document.querySelectorAll('.source-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.sourceId === sourceId);
  });
  loadFiles('');
}

// ── File listing ──────────────────────────────────────────────────────────
async function loadFiles(folderId) {
  const seq = ++state.loadSeq;
  state.folderId = folderId;
  state.search = '';
  document.getElementById('search-input').value = '';
  document.getElementById('results-info').textContent = '';
  document.getElementById('file-list').innerHTML =
    '<tr><td colspan="4" class="loading">加载中…</td></tr>';

  try {
    const [filesData, pathData] = await Promise.all([
      apiJson(withSource('/api/files?folderId=' + encodeURIComponent(folderId))),
      apiJson(withSource('/api/path?folderId=' + encodeURIComponent(folderId)))
    ]);
    if (seq !== state.loadSeq) return; // 丢弃过期响应（快速切换目录/数据源）

    state.files = Array.isArray(filesData.files) ? filesData.files : [];
    state.truncated = !!filesData.truncated;
    renderBreadcrumb(Array.isArray(pathData.path) ? pathData.path : []);
    renderFiles();
  } catch (e) {
    if (seq !== state.loadSeq) return;
    document.getElementById('file-list').innerHTML =
      `<tr><td colspan="4" class="empty">加载失败：${escapeHtml(e.message)}</td></tr>`;
  }
}

function renderBreadcrumb(path) {
  const bc = document.getElementById('breadcrumb');
  bc.textContent = '';
  path.forEach((seg, index) => {
    if (index > 0) {
      const sep = document.createElement('span');
      sep.textContent = '/';
      bc.appendChild(sep);
    }
    if (index === path.length - 1) {
      const current = document.createElement('span');
      current.textContent = seg.name;
      bc.appendChild(current);
    } else {
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'link-btn';
      link.textContent = seg.name;
      link.addEventListener('click', () => loadFiles(seg.id));
      bc.appendChild(link);
    }
  });
}

function renderFiles() {
  const tbody = document.getElementById('file-list');
  const resultsInfo = document.getElementById('results-info');

  let files = state.files;
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    files = files.filter(f => String(f.name || '').toLowerCase().includes(q));
  }
  files = sortFiles(files, state.sort);

  if (state.search.trim()) {
    resultsInfo.textContent = `共 ${state.files.length} 个文件，已筛选 ${files.length} 个`;
  } else if (files.length > 0) {
    resultsInfo.textContent = `共 ${files.length} 个文件` + (state.truncated ? '（超出上限，已截断）' : '');
  } else {
    resultsInfo.textContent = '';
  }

  if (!files.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">${state.search.trim() ? '没有匹配的文件' : '此文件夹为空'}</td></tr>`;
    return;
  }

  tbody.innerHTML = files.map(fileRowHtml).join('');
}

function fileRowHtml(file) {
  const isFolder = file.mimeType === FOLDER_MIME;
  const id = escapeHtml(file.id);
  const name = escapeHtml(file.name);
  const mime = escapeHtml(file.mimeType || '');

  const nameCell = isFolder
    ? `<button type="button" class="link-btn" data-act="open" data-id="${id}">${name}</button>`
    : `<button type="button" class="link-btn" data-act="preview" data-id="${id}" data-mime="${mime}" title="点击预览">${name}</button>`;

  let actionCell = '';
  if (!isFolder) {
    const cached = !!file.cached;
    const percent = file.cachePercent;
    const running = !cached && percent != null;
    const cls = cached ? 'btn-cache cached' : (running ? 'btn-cache caching' : 'btn-cache');
    const label = cached ? '✅ 已缓存' : (running ? `⏳ ${percent}%` : '💾 缓存');
    actionCell = `
      <div class="action-btns">
        <button type="button" class="btn btn-sm ${cls}" id="cache-btn-${id}" data-act="cache" data-id="${id}" title="缓存到服务器">${label}</button>
        <button type="button" class="btn btn-sm btn-share" data-act="share" data-id="${id}" title="复制下载链接">🔗 分享</button>
      </div>`;
  }

  return `<tr>
    <td class="col-name">
      <div class="file-name">
        <span class="file-icon">${fileIcon(file.mimeType)}</span>${nameCell}
      </div>
    </td>
    <td class="col-size">${fmtSize(file.size)}</td>
    <td class="col-modified">${fmtDate(file.modifiedTime)}</td>
    <td class="col-action">${actionCell}</td>
  </tr>`;
}

function sortFiles(files, sortKey) {
  const isDesc = sortKey.includes(' desc');
  const key = sortKey.replace(' desc', '');
  const foldersFirst = (a, b) => {
    const aFolder = a.mimeType === FOLDER_MIME;
    const bFolder = b.mimeType === FOLDER_MIME;
    if (aFolder !== bFolder) return aFolder ? -1 : 1;
    return 0;
  };

  return [...files].sort((a, b) => {
    const folderOrder = foldersFirst(a, b);
    if (folderOrder !== 0) return folderOrder;
    const nameA = String(a.name || '');
    const nameB = String(b.name || '');

    if (key === 'name' || sortKey === 'folder,name') {
      return isDesc ? nameB.localeCompare(nameA, 'zh-CN') : nameA.localeCompare(nameB, 'zh-CN');
    }
    if (key === 'size') {
      const sizeA = parseInt(a.size, 10) || 0;
      const sizeB = parseInt(b.size, 10) || 0;
      return isDesc ? sizeB - sizeA : sizeA - sizeB;
    }
    if (key === 'modifiedTime') {
      const timeA = new Date(a.modifiedTime || 0).getTime() || 0;
      const timeB = new Date(b.modifiedTime || 0).getTime() || 0;
      return isDesc ? timeB - timeA : timeA - timeB;
    }
    return 0;
  });
}

function handleSearch(value) {
  state.search = value;
  renderFiles();
}
function handleSort(value) {
  state.sort = value;
  renderFiles();
}

// ── Cache & Share ─────────────────────────────────────────────────────────
async function doCacheFile(fileId, btn) {
  if (btn.classList.contains('cached')) { showToast('✅ 已缓存，无需重复操作'); return; }
  if (btn.classList.contains('caching')) return;

  btn.classList.add('caching');
  btn.textContent = '⏳ 开始缓存…';
  const file = state.files.find(f => f.id === fileId);

  try {
    await apiJson(withSource('/api/cache/' + encodeURIComponent(fileId)), { method: 'POST' });
    pollCacheStatus(fileId, btn, file && file.name);
  } catch (e) {
    btn.classList.remove('caching');
    btn.textContent = '💾 缓存';
    showToast('❌ ' + e.message);
  }
}

async function pollCacheStatus(fileId, btn, name) {
  const deadline = Date.now() + 30 * 60 * 1000;
  while (Date.now() < deadline) {
    await sleep(1000);
    let status;
    try {
      status = await apiJson(withSource('/api/cache-status/' + encodeURIComponent(fileId)));
    } catch (e) {
      btn.classList.remove('caching');
      btn.textContent = '💾 缓存';
      showToast('❌ ' + e.message);
      return;
    }
    if (status.cached) {
      btn.classList.remove('caching');
      btn.classList.add('cached');
      btn.textContent = '✅ 已缓存';
      showToast(`缓存完成：${name || ''} (${fmtSize(status.size)})`);
      return;
    }
    if (status.status === 'error') {
      btn.classList.remove('caching');
      btn.textContent = '💾 缓存';
      showToast('❌ ' + (status.error || '缓存失败'));
      return;
    }
    btn.textContent = status.percent != null ? `⏳ ${status.percent}%` : '⏳ 缓存中…';
  }
  btn.classList.remove('caching');
  btn.textContent = '💾 缓存';
  showToast('⏳ 缓存仍在后台进行，可稍后刷新查看');
}

async function doShareLink(fileId) {
  try {
    const data = await apiJson(withSource('/api/link/' + encodeURIComponent(fileId)));
    const ok = await copyToClipboard(data.url);
    if (ok) showToast('🔗 下载链接已复制');
  } catch (e) {
    showToast('❌ ' + (e.message || '获取链接失败'));
  }
}

async function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch { /* 回退 */ }
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, 99999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  document.body.removeChild(ta);
  if (!ok) {
    window.prompt('复制下载链接：', text);
    return false;
  }
  return true;
}

// ── Toast ─────────────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;z-index:9999;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// ── Preview ───────────────────────────────────────────────────────────────
let pdfCleanup = null;

function cleanupPdf() {
  if (!pdfCleanup) return;
  try { pdfCleanup(); } catch { /* ignore */ }
  pdfCleanup = null;
}

function closePreview() {
  cleanupPdf();
  document.getElementById('preview-modal').classList.remove('open');
  document.getElementById('preview-area').textContent = '';
}

async function doPreview(fileId, mimeType) {
  const area = document.getElementById('preview-area');
  const title = document.getElementById('preview-title');
  cleanupPdf();
  area.innerHTML = '<div class="no-preview">加载中…</div>';
  title.textContent = '文件预览';
  document.getElementById('preview-modal').classList.add('open');

  const mime = mimeType || '';

  try {
    if (mime.startsWith('image/') || mime.startsWith('video/') || mime.startsWith('audio/') || mime === 'application/pdf') {
      const data = await apiJson(withSource('/api/preview/' + encodeURIComponent(fileId)));
      title.textContent = data.name || '文件预览';

      if (mime.startsWith('image/')) {
        area.innerHTML = `<img src="${escapeHtml(data.url)}" alt="预览">`;
        const img = area.querySelector('img');
        img.addEventListener('error', () => {
          area.innerHTML = '<div class="no-preview">图片加载失败，可尝试下载查看</div>';
        });
        return;
      }

      if (mime.startsWith('video/')) {
        area.innerHTML = `<video src="${escapeHtml(data.url)}" controls style="display:block;width:100%;height:100%">您的浏览器不支持视频播放</video>`;
        const video = area.querySelector('video');
        video.addEventListener('error', () => {
          area.innerHTML = '<div class="no-preview">视频加载失败，可尝试下载查看</div>';
        });
        return;
      }

      if (mime.startsWith('audio/')) {
        area.innerHTML = `<audio src="${escapeHtml(data.url)}" controls style="display:block;margin:40px auto">您的浏览器不支持音频播放</audio>`;
        return;
      }

      if (!window.pdfjsLib) {
        area.innerHTML = '<div class="no-preview">PDF.js 加载失败（CDN 不可用），请刷新重试或下载查看</div>';
        return;
      }
      await renderPdfViewer(area, data.url, data.name, data.size);
      return;
    }

    if (mime.startsWith('text/') || mime === 'application/json' || mime === 'application/xml' || mime === 'application/javascript') {
      const data = await apiJson(withSource('/api/preview/' + encodeURIComponent(fileId)));
      title.textContent = data.name || '文件预览';

      const response = await fetch(data.url, { credentials: 'same-origin' });
      if (!response.ok) throw new Error('无法加载文件内容');

      const declared = Number(response.headers.get('content-length') || 0);
      if (declared > TEXT_PREVIEW_MAX) {
        area.innerHTML = `<div class="no-preview">文件过大（${fmtSize(declared)}），请下载后查看</div>`;
        return;
      }

      let text = await response.text();
      let truncated = false;
      if (text.length > TEXT_PREVIEW_MAX) {
        text = text.slice(0, TEXT_PREVIEW_MAX);
        truncated = true;
      }

      area.textContent = '';
      const pre = document.createElement('pre');
      pre.textContent = text;
      area.appendChild(pre);
      if (truncated) {
        const note = document.createElement('div');
        note.className = 'preview-note';
        note.textContent = '文件较大，仅显示前 500 KB';
        area.appendChild(note);
      }
      return;
    }

    if (mime === DOCX_MIME || mime === 'application/vnd.google-apps.document') {
      area.innerHTML = '<div class="no-preview">正在加载预览器…</div>';
      const mammoth = await loadScript(MAMMOTH_URL, 'mammoth');
      const response = await fetch(withSource('/api/preview-data/' + encodeURIComponent(fileId)), { credentials: 'same-origin' });
      if (response.status === 401) { showLogin(); throw new Error('登录已过期，请重新登录'); }
      if (!response.ok) throw new Error(await errorMessage(response));

      const result = await mammoth.convertToHtml({ arrayBuffer: await response.arrayBuffer() });
      const wrap = document.createElement('div');
      wrap.className = 'doc-preview';
      wrap.innerHTML = result.value; // mammoth 输出 HTML
      area.textContent = '';
      area.appendChild(wrap);
      return;
    }

    if (XLSX_MIMES.includes(mime)) {
      area.innerHTML = '<div class="no-preview">正在加载预览器…</div>';
      const XLSX = await loadScript(XLSX_URL, 'XLSX');
      const response = await fetch(withSource('/api/preview-data/' + encodeURIComponent(fileId)), { credentials: 'same-origin' });
      if (response.status === 401) { showLogin(); throw new Error('登录已过期，请重新登录'); }
      if (!response.ok) throw new Error(await errorMessage(response));

      const workbook = XLSX.read(await response.arrayBuffer(), { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      const wrap = document.createElement('div');
      wrap.className = 'xlsx-preview';
      wrap.style.cssText = 'overflow:auto;width:100%;height:100%;padding:12px;';

      if (!sheetName) {
        wrap.textContent = '工作簿中没有工作表';
      } else {
        wrap.innerHTML = XLSX.utils.sheet_to_html(workbook.Sheets[sheetName], { editable: false });
        const style = document.createElement('style');
        style.textContent = `
          .xlsx-preview table { border-collapse: collapse; font-size: 13px; font-family: sans-serif; }
          .xlsx-preview th { background: #f0f0f0; border: 1px solid #ccc; padding: 6px 10px; text-align: left; white-space: nowrap; }
          .xlsx-preview td { border: 1px solid #ddd; padding: 5px 10px; white-space: nowrap; }
        `;
        area.textContent = '';
        area.appendChild(style);
        area.appendChild(wrap);
        return;
      }
      area.textContent = '';
      area.appendChild(wrap);
      return;
    }

    // 其他类型：提供下载
    const link = await apiJson(withSource('/api/link/' + encodeURIComponent(fileId)));
    area.textContent = '';
    const box = document.createElement('div');
    box.className = 'no-preview';
    const hint = document.createElement('div');
    hint.textContent = '此文件类型暂不支持预览';
    const download = document.createElement('a');
    download.href = link.url;
    download.className = 'btn btn-primary';
    download.textContent = '下载文件';
    download.setAttribute('download', '');
    box.appendChild(hint);
    box.appendChild(download);
    area.appendChild(box);
  } catch (e) {
    area.innerHTML = `<div class="no-preview">预览失败：${escapeHtml(e.message)}</div>`;
  }
}

// ── PDF.js 分页渲染 ───────────────────────────────────────────────────────
async function renderPdfViewer(container, pdfUrl, fileName, fileSize) {
  container.innerHTML = `
    <div id="pdf-container">
      <div id="pdf-pages" class="pdf-loading">正在加载 PDF…</div>
    </div>
    <div class="pdf-page-controls">
      <button type="button" id="pdf-prev" disabled>◀ 上一页</button>
      <span id="pdf-page-info">第 1 / 1 页</span>
      <button type="button" id="pdf-next" disabled>下一页 ▶</button>
      <span class="pdf-meta"></span>
    </div>`;

  const scroller = document.getElementById('pdf-container');
  const pagesEl = document.getElementById('pdf-pages');
  const prevBtn = document.getElementById('pdf-prev');
  const nextBtn = document.getElementById('pdf-next');
  const pageInfo = document.getElementById('pdf-page-info');
  const metaEl = container.querySelector('.pdf-meta');
  metaEl.textContent = `${fileName || ''} · ${fmtSize(fileSize)}`; // textContent，避免文件名注入

  let pdf = null;
  let destroyed = false;
  const observers = [];
  const rendered = new Set();
  const queued = new Set();
  const queue = [];
  let busy = false;

  pdfCleanup = () => {
    destroyed = true;
    observers.forEach(observer => observer.disconnect());
    if (pdf) { try { pdf.destroy(); } catch { /* ignore */ } }
    pdf = null;
  };

  try {
    pdf = await pdfjsLib.getDocument({ url: pdfUrl, rangeChunkSize: 64 * 1024 }).promise;
    if (destroyed) { try { pdf.destroy(); } catch { /* ignore */ } return; }

    const total = pdf.numPages;
    pageInfo.textContent = `第 1 / ${total} 页`;

    // 用第 1 页尺寸给所有页做占位，保证滚动与页码计算可用
    const firstPage = await pdf.getPage(1);
    const baseViewport = firstPage.getViewport({ scale: 1 });
    const availableWidth = (scroller.clientWidth || 800) - 32;
    const scale = Math.max(0.2, Math.min(availableWidth / baseViewport.width, 2));
    const placeholderHeight = Math.max(80, Math.round(baseViewport.height * scale));

    pagesEl.classList.remove('pdf-loading');
    pagesEl.textContent = '';
    for (let i = 1; i <= total; i += 1) {
      const pageEl = document.createElement('div');
      pageEl.className = 'pdf-page';
      pageEl.dataset.page = String(i);
      pageEl.style.height = placeholderHeight + 'px';
      pagesEl.appendChild(pageEl);
    }

    async function renderPage(num) {
      if (rendered.has(num) || destroyed) return;
      rendered.add(num);
      const pageEl = pagesEl.querySelector(`[data-page="${num}"]`);
      if (!pageEl) return;
      try {
        const page = await pdf.getPage(num);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        if (destroyed) return;
        pageEl.style.height = '';
        pageEl.textContent = '';
        pageEl.appendChild(canvas);
      } catch {
        pageEl.classList.add('pdf-page-error');
        pageEl.textContent = `第 ${num} 页渲染失败`;
      }
    }

    async function runQueue() {
      if (busy) return;
      busy = true;
      while (queue.length && !destroyed) {
        const num = queue.shift();
        queued.delete(num);
        await renderPage(num);
      }
      busy = false;
    }

    function requestRender(num) {
      if (!num || rendered.has(num) || queued.has(num)) return;
      queued.add(num);
      queue.push(num);
      runQueue();
    }

    // 进入视野即渲染（所有页面占位均已存在）
    const lazyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) requestRender(Number(entry.target.dataset.page));
      });
    }, { root: scroller, rootMargin: '400px 0px' });
    observers.push(lazyObserver);
    pagesEl.querySelectorAll('.pdf-page').forEach(el => lazyObserver.observe(el));

    // 当前页指示（中间 10% 区域内的页面）
    const visiblePages = new Set();
    const trackerObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const num = Number(entry.target.dataset.page);
        if (entry.isIntersecting) visiblePages.add(num);
        else visiblePages.delete(num);
      });
      if (!visiblePages.size) return;
      const current = Math.min(...visiblePages);
      pageInfo.textContent = `第 ${current} / ${total} 页`;
      prevBtn.disabled = current <= 1;
      nextBtn.disabled = current >= total;
    }, { root: scroller, rootMargin: '-45% 0px -45% 0px' });
    observers.push(trackerObserver);
    pagesEl.querySelectorAll('.pdf-page').forEach(el => trackerObserver.observe(el));

    function currentPage() {
      const match = /第 (\d+)/.exec(pageInfo.textContent || '');
      return match ? Number(match[1]) : 1;
    }
    function scrollToPage(num) {
      if (num < 1 || num > total) return;
      const el = pagesEl.querySelector(`[data-page="${num}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    prevBtn.addEventListener('click', () => scrollToPage(currentPage() - 1));
    nextBtn.addEventListener('click', () => scrollToPage(currentPage() + 1));

    prevBtn.disabled = true;
    nextBtn.disabled = total <= 1;
    requestRender(1);
  } catch (err) {
    pagesEl.classList.remove('pdf-loading');
    pagesEl.textContent = '';
    const note = document.createElement('div');
    note.className = 'no-preview';
    note.textContent = 'PDF 预览失败：' + (err && err.message ? err.message : '未知错误');
    pagesEl.appendChild(note);
  }
}

// ── 事件绑定 ───────────────────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('logout-btn').addEventListener('click', doLogout);
document.getElementById('preview-close').addEventListener('click', closePreview);

document.getElementById('search-input').addEventListener('input', (e) => handleSearch(e.target.value));
document.getElementById('sort-select').addEventListener('change', (e) => handleSort(e.target.value));

document.getElementById('file-list').addEventListener('click', (e) => {
  const target = e.target.closest('[data-act]');
  if (!target) return;
  const fileId = target.dataset.id;
  const action = target.dataset.act;
  if (action === 'open') loadFiles(fileId);
  else if (action === 'preview') doPreview(fileId, target.dataset.mime || '');
  else if (action === 'cache') doCacheFile(fileId, target);
  else if (action === 'share') doShareLink(fileId);
});

document.getElementById('preview-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closePreview();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('login-page').style.display !== 'none') {
    doLogin();
  }
  if (e.key === 'Escape' && document.getElementById('preview-modal').classList.contains('open')) {
    closePreview();
  }
});

checkAuth();
